name: BinPyCI

on:
  push:
    # Restricting push triggers to the default branch avoids running
    # validation twice (push + pull_request events) for every push to a PR
    # branch. Feature branches are covered by pull_request; release refs are
    # handled by release.yml.
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_job:
    ##
    # Run quick linting and typing checks.
    # To disable all linting add "linter=false" to the xcookie config.
    # To disable type checks add "notypes" to the xcookie tags.
    ##
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source
      uses: actions/checkout@v7.0.1
    - name: Set up Python 3.14 for linting
      uses: actions/setup-python@v6.2.0
      with:
        python-version: '3.14'
    - name: Install dependencies
      run: |-
        python -m pip install pip uv -U
        python -m uv pip install flake8
    - name: Lint with flake8
      run: |-
        # stop the build if there are Python syntax errors or undefined names
        flake8 ./kwimage_ext --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Typecheck
      run: |-
        python -m pip install ty
        pip install -r requirements/runtime.txt -r requirements/tests.txt
        ty check ./kwimage_ext
  build_binpy_wheels:
    ##
    # Build the binary wheels. Note: even though cibuildwheel will test
    # them internally here, we will test them independently later in the
    # test_binpy_wheels step.
    ##
    name: ${{ matrix.os }}, arch=${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One built wheel per platform is reusable across the configured CPython test
        # versions. This covers both version-independent wheels (e.g. py3-none) and
        # stable-ABI wheels (e.g. cp310-abi3). The concrete build selector is project
        # packaging policy in [tool.cibuildwheel].build.
        os:
        - ubuntu-latest
        - macOS-latest
        - windows-latest
        arch:
        - auto
    steps:
    - name: Checkout source
      uses: actions/checkout@v7.0.1
    - name: Build binary wheels
      uses: pypa/cibuildwheel@v4.1.1
      with:
        output-dir: wheelhouse
        config-file: pyproject.toml
      env:
        CIBW_ARCHS_LINUX: ${{ matrix.arch }}
        PYTHONUTF8: '1'
        CIBW_ENABLE: cpython-prerelease
    - name: Show built files
      shell: bash
      run: ls -la wheelhouse
    - name: Set up Python 3.14 for wheel validation
      uses: actions/setup-python@v6.2.0
      with:
        python-version: '3.14'
    - name: Validate built wheel artifacts
      shell: bash
      run: python dev/validate_wheel_artifact.py wheelhouse/kwimage_ext*.whl
    - uses: actions/upload-artifact@v6.0.0
      name: Upload wheels artifact
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.arch }}
        path: ./wheelhouse/kwimage_ext*.whl
  test_binpy_wheels:
    ##
    # Download the previously built binary wheels from the
    # build_binpy_wheels step, and test them in an independent
    # environment.
    ##
    name: ${{ matrix.python-version }} on ${{ matrix.os }}, arch=${{ matrix.arch }} with ${{ matrix.install-extras }}
    runs-on: ${{ matrix.os }}
    needs:
    - build_binpy_wheels
    strategy:
      fail-fast: false
      matrix:
        # Xcookie generates an explicit list of environments that will be used
        # for testing instead of using the more concise matrix notation.
        include:
        - python-version: '3.10'
          install-extras: tests
          os: ubuntu-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'true'
          lock-requirements: requirements/locks/tests.txt
        - python-version: '3.10'
          install-extras: tests
          os: macOS-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'true'
          lock-requirements: requirements/locks/tests.txt
        - python-version: '3.10'
          install-extras: tests
          os: windows-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'true'
          lock-requirements: requirements/locks/tests.txt
        - python-version: '3.14'
          install-extras: tests,optional
          os: ubuntu-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'true'
          lock-requirements: requirements/locks/tests-optional.txt
        - python-version: '3.14'
          install-extras: tests,optional
          os: macOS-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'true'
          lock-requirements: requirements/locks/tests-optional.txt
        - python-version: '3.14'
          install-extras: tests,optional
          os: windows-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'true'
          lock-requirements: requirements/locks/tests-optional.txt
        - python-version: '3.14'
          install-extras: tests
          os: macOS-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'false'
        - python-version: '3.14'
          install-extras: tests
          os: windows-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'false'
        - python-version: '3.10'
          install-extras: tests,optional
          os: ubuntu-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'false'
        - python-version: '3.11'
          install-extras: tests,optional
          os: ubuntu-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'false'
        - python-version: '3.12'
          install-extras: tests,optional
          os: ubuntu-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'false'
        - python-version: '3.13'
          install-extras: tests,optional
          os: ubuntu-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'false'
        - python-version: '3.14'
          install-extras: tests,optional
          os: ubuntu-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'false'
        - python-version: '3.15'
          install-extras: tests,optional
          os: ubuntu-latest
          arch: auto
          allow-prereleases: 'true'
          check-latest: 'true'
          experimental: true
          use-lockfile: 'false'
        - python-version: '3.10'
          install-extras: tests,optional
          os: macOS-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'false'
        - python-version: '3.11'
          install-extras: tests,optional
          os: macOS-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'false'
        - python-version: '3.12'
          install-extras: tests,optional
          os: macOS-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'false'
        - python-version: '3.13'
          install-extras: tests,optional
          os: macOS-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'false'
        - python-version: '3.14'
          install-extras: tests,optional
          os: macOS-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'false'
        - python-version: '3.15'
          install-extras: tests,optional
          os: macOS-latest
          arch: auto
          allow-prereleases: 'true'
          check-latest: 'true'
          experimental: true
          use-lockfile: 'false'
        - python-version: '3.10'
          install-extras: tests,optional
          os: windows-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'false'
        - python-version: '3.11'
          install-extras: tests,optional
          os: windows-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'false'
        - python-version: '3.12'
          install-extras: tests,optional
          os: windows-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'false'
        - python-version: '3.13'
          install-extras: tests,optional
          os: windows-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'false'
        - python-version: '3.14'
          install-extras: tests,optional
          os: windows-latest
          arch: auto
          allow-prereleases: 'false'
          check-latest: 'false'
          use-lockfile: 'false'
        - python-version: '3.15'
          install-extras: tests,optional
          os: windows-latest
          arch: auto
          allow-prereleases: 'true'
          check-latest: 'true'
          experimental: true
          use-lockfile: 'false'
    steps:
    - name: Checkout source
      uses: actions/checkout@v7.0.1
    - name: Enable MSVC 64bit
      uses: ilammy/msvc-dev-cmd@v1.13.0
      if: ${{ startsWith(matrix.os, 'windows-') }}
      with:
        arch: ${{ contains(matrix.os, 'arm') && 'arm64' || 'x64' }}
    - name: Setup Python
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: ${{ matrix.allow-prereleases }}
        check-latest: ${{ matrix.check-latest }}
      id: setup_python
      continue-on-error: ${{ matrix.experimental || false }}
    - uses: actions/download-artifact@v7.0.0
      name: Download wheel for this platform
      with:
        name: wheels-${{ matrix.os }}-${{ matrix.arch }}
        path: wheelhouse
    - name: Install wheel ${{ matrix.install-extras }}
      id: install_wheel
      if: steps.setup_python.outcome == 'success'
      continue-on-error: ${{ matrix.experimental || false }}
      shell: bash
      env:
        INSTALL_EXTRAS: ${{ matrix.install-extras }}
        USE_UV_LOCK: ${{ matrix.use-lockfile }}
        LOCK_REQUIREMENTS: ${{ matrix.lock-requirements }}
      run: |-
        if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            MSVC_CL_EXE="$(command -v cl.exe || true)"
            if [[ -n "$MSVC_CL_EXE" ]]; then
                MSVC_LINK_DIR="$(dirname "$MSVC_CL_EXE")"
                export PATH="$MSVC_LINK_DIR:$PATH"
                hash -r
                echo "Prioritized MSVC linker directory: $MSVC_LINK_DIR"
                echo "Resolved link.exe: $(command -v link.exe || true)"
            else
                echo "MSVC cl.exe was not found; leaving PATH unchanged"
            fi
        fi
        echo "Finding the path to the wheel"
        ls wheelhouse || echo "wheelhouse does not exist"
        echo "Installing helpers: update pip"
        python -m pip install pip uv -U
        echo "Installing helpers: setuptools"
        python -m uv pip install --resolution=highest setuptools>=77 setuptools_scm wheel build -U
        echo "Installing helpers: tomli and pkginfo"
        python -m uv pip install --resolution=highest tomli pkginfo packaging
        export WHEEL_FPATH=$(python -c "if 1:
            import pathlib
            from packaging import tags
            from packaging.utils import parse_wheel_filename
            dist_dpath = pathlib.Path('wheelhouse')
            wheels = sorted(dist_dpath.glob('kwimage_ext*.whl'))
            if wheels:
                sys_tags = set(tags.sys_tags())
                matching = []
                for w in wheels:
                    try:
                        _, _, _, wheel_tags = parse_wheel_filename(w.name)
                    except Exception:
                        continue
                    if any(t in sys_tags for t in wheel_tags):
                        matching.append(w)
                fpath = sorted(matching or wheels)[-1]
            else:
                sdists = sorted(dist_dpath.glob('kwimage_ext*.tar.gz'))
                if not sdists:
                    raise SystemExit('No wheel artifacts found in wheelhouse')
                fpath = sdists[-1]
            print(str(fpath).replace(chr(92), chr(47)))
        ")
        echo "WHEEL_FPATH=$WHEEL_FPATH"
        echo "INSTALL_EXTRAS=$INSTALL_EXTRAS"
        echo "USE_UV_LOCK=$USE_UV_LOCK"
        echo "LOCK_REQUIREMENTS=$LOCK_REQUIREMENTS"
        if [[ -n "${INSTALL_EXTRAS:-}" ]]; then
            INSTALL_TARGET="${WHEEL_FPATH}[${INSTALL_EXTRAS}]"
        else
            INSTALL_TARGET="${WHEEL_FPATH}"
        fi
        echo "INSTALL_TARGET=$INSTALL_TARGET"
        LOCK_ARGS=()
        if [[ "${USE_UV_LOCK:-false}" == "true" ]]; then
            if [[ -z "${LOCK_REQUIREMENTS:-}" ]]; then
                echo "USE_UV_LOCK=true but LOCK_REQUIREMENTS is empty"
                exit 1
            fi
            if [[ ! -f "$LOCK_REQUIREMENTS" ]]; then
                echo "Missing checked-in lock requirements: $LOCK_REQUIREMENTS"
                exit 1
            fi
            echo "Using checked-in lock requirements: $LOCK_REQUIREMENTS"
            cat "$LOCK_REQUIREMENTS"
            LOCK_ARGS=(--constraint "$LOCK_REQUIREMENTS")
        fi
        python -m uv pip install --prerelease=allow "${LOCK_ARGS[@]}" "${INSTALL_TARGET}"
        echo "Install finished."
    - name: Test wheel ${{ matrix.install-extras }}
      id: test_wheel
      if: steps.install_wheel.outcome == 'success'
      continue-on-error: ${{ matrix.experimental || false }}
      shell: bash
      env:
        CI_PYTHON_VERSION: py${{ matrix.python-version }}
        KWIMAGE_EXT_FORCE_RUST: '1'
      run: |-
        echo "Creating test sandbox directory"
        export WORKSPACE_DNAME="testdir_${CI_PYTHON_VERSION}_${GITHUB_RUN_ID}_${RUNNER_OS}"
        echo "WORKSPACE_DNAME=$WORKSPACE_DNAME"
        mkdir -p $WORKSPACE_DNAME
        echo "cd-ing into the workspace"
        cd $WORKSPACE_DNAME
        pwd
        ls -altr
        # Get the path to the installed package and run the tests
        export MOD_DPATH=$(python -c "import kwimage_ext, os; print(os.path.dirname(kwimage_ext.__file__))")
        export MOD_NAME=kwimage_ext
        echo "
        ---
        MOD_DPATH = $MOD_DPATH
        ---
        running the pytest command inside the workspace
        ---
        "
        python -m pytest --verbose --xdoctest --cov-config ../pyproject.toml --cov-report term --durations=100 --cov="$MOD_NAME" "$MOD_DPATH" ../tests
        echo "pytest command finished, moving the coverage file to the repo root"
        ls -al
        # Move coverage file to a new name
        mv .coverage "../.coverage.$WORKSPACE_DNAME"
        echo "changing directory back to th repo root"
        cd ..
        ls -al
    - name: Combine coverage Linux
      if: runner.os == 'Linux' && steps.test_wheel.outcome == 'success'
      run: |-
        echo '############ PWD'
        pwd
        cp .wheelhouse/.coverage* . || true
        ls -al
        uv pip install coverage[toml] | pip install coverage[toml]
        echo '############ combine'
        coverage combine . || true
        echo '############ XML'
        coverage xml -o ./coverage.xml || true
        echo '### The cwd should now have a coverage.xml'
        ls -altr
        pwd
    - uses: codecov/codecov-action@v5.5.2
      name: Codecov Upload
      with:
        file: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
      if: steps.test_wheel.outcome == 'success'
    - name: Report experimental failure
      if: matrix.experimental && (steps.setup_python.outcome == 'failure' || steps.install_wheel.outcome == 'failure' || steps.test_wheel.outcome == 'failure')
      shell: bash
      run: |-
        message="Experimental matrix entry failed; see logs above."
        echo "::warning title=Experimental CI failure::$message"
        echo "### Experimental CI failure" >> "$GITHUB_STEP_SUMMARY"
        echo "$message" >> "$GITHUB_STEP_SUMMARY"
