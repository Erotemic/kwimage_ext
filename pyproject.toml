[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "kwimage_ext"
version = "0.4.0"
description = "Binary acceleration extensions for kwimage"
readme = "README.rst"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Kitware Inc." },
  { name = "Jon Crall", email = "jon.crall@kitware.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "ubelt>=1.3.3",
  "numpy>=2.3.2; python_version >= '3.14'",
  "numpy>=2.1.0; python_version >= '3.13' and python_version < '3.14'",
  "numpy>=1.26.0; python_version >= '3.12' and python_version < '3.13'",
  "numpy>=1.23.2; python_version >= '3.11' and python_version < '3.12'",
  "numpy>=1.21.6; python_version >= '3.10' and python_version < '3.11'",
]

[project.optional-dependencies]
tests = [
  "xdoctest>=1.1.5",
  "pytest>=6.2.5",
  "pytest-cov>=3.0.0",
  "coverage>=6.1.1",
]
optional = ["torch>=1.11.0; python_version < '3.15'"]
all = [
  "xdoctest>=1.1.5",
  "pytest>=6.2.5",
  "pytest-cov>=3.0.0",
  "coverage>=6.1.1",
  "torch>=1.11.0; python_version < '3.15'",
]

# Keep generated CI extra names valid during the Rust transition.
# These are conservative aliases; xcookie can regenerate exact pins later.
runtime-strict = []
tests-strict = [
  "xdoctest>=1.1.5",
  "pytest>=6.2.5",
  "pytest-cov>=3.0.0",
  "coverage>=6.1.1",
]
optional-strict = ["torch>=1.11.0; python_version < '3.15'"]
all-strict = [
  "xdoctest>=1.1.5",
  "pytest>=6.2.5",
  "pytest-cov>=3.0.0",
  "coverage>=6.1.1",
  "torch>=1.11.0; python_version < '3.15'",
]

[project.urls]
Homepage = "https://gitlab.kitware.com/computer-vision/kwimage_ext"
Documentation = "https://kwimage_ext.readthedocs.io"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "."
python-packages = ["kwimage_ext"]
module-name = "kwimage_ext._rust"
bindings = "pyo3"
features = ["pyo3/extension-module"]
strip = false

[tool.xcookie]
tags = ["kitware", "gitlab", "github", "binpy", "nosrcdist"]
author = "Kitware Inc., Jon Crall"
os = [ "all", "win", "osx", "linux",]
rel_mod_parent_dpath = "."
#author_email = 'kitware@kitware.com, jon.crall@kitware.com'
author_email = 'jon.crall@kitware.com'
mod_name = "kwimage_ext"
repo_name = "kwimage_ext"
dev_status = "alpha"
min_python = "3.10"
url = 'https://gitlab.kitware.com/computer-vision/kwimage_ext'
github_url = "https://github.com/Erotemic/kwimage_ext"
ci_reusable_wheels = true
ci_pypi_trusted_publishing = ["github", "gitlab"]
ci_wheel_build_post_commands = ["python dev/validate_wheel_artifact.py wheelhouse/kwimage_ext*.whl"]

[tool.xcookie.test_env]
KWIMAGE_EXT_FORCE_RUST = "1"

[tool.xcookie.ci_source_checks.backend-parity]
name = "Rust vs legacy parity"
python_version = "3.13"
setup_commands = ["curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal", "export PATH=\"$HOME/.cargo/bin:$PATH\"", "rustc --version", "cargo --version", "python -m pip install -e '.[tests]'"]
commands = ["./dev/check_backend_parity.sh"]
[tool.cibuildwheel]
# PyO3 is built with abi3-py310, so build one CPython 3.10 baseline wheel per
# platform and exercise that same artifact on every supported Python >= 3.10.
build = "cp310-*"
# Publish both glibc (manylinux) and musl (musllinux) Linux wheels.  The
# release workflow builds this selector natively on x86_64 and aarch64 hosts.
skip = "pp*"
archs = ["auto64"]
build-verbosity = 1
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
# Exercise the compiled extension inside each cibuildwheel container. This is
# especially important for musllinux wheels, which cannot be imported on the
# Ubuntu host used to orchestrate the build.
test-command = "python -c \"import kwimage_ext, kwimage_ext._rust; print(kwimage_ext.__file__)\""

[tool.mypy]
ignore_missing_imports = true

[[tool.ty.overrides]]
include = ["kwimage_ext/algo/_nms_backend/torch_nms.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"
unresolved-attribute = "ignore"

[tool.pytest.ini_options]
addopts = "-p no:doctest --xdoctest --xdoctest-style=google --ignore-glob=setup.py"
norecursedirs = ".git ignore build __pycache__ dev _skbuild"
filterwarnings = [ "default", "ignore:.*No cfgstr given in Cacher constructor or call.*:Warning", "ignore:.*Define the __nice__ method for.*:Warning", "ignore:.*private pytest class or function.*:Warning",]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [ "pragma: no cover", ".*  # pragma: no cover", ".*  # nocover", "def __repr__", "raise AssertionError", "raise NotImplementedError", "if 0:", "if trace is not None", "verbose = .*", "^ *raise", "^ *pass *$", "if _debug:", "if __name__ == .__main__.:", ".*if six.PY2:",]
omit = [ "kwimage_ext/__main__.py", "*/setup.py",]

#[tool.maturin]
#features = ["pyo3/extension-module"]

[tool.cibuildwheel.linux]
# cibuildwheel runs this in both manylinux (RPM-family) and musllinux (Alpine)
# containers, so do not assume yum exists.
before-all = "if command -v yum >/dev/null 2>&1; then yum install -y curl; elif command -v dnf >/dev/null 2>&1; then dnf install -y curl; elif command -v apk >/dev/null 2>&1; then apk add --no-cache curl; else echo 'No supported package manager found for Rust bootstrap' >&2; exit 1; fi && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

[tool.cibuildwheel.macos.environment]
# Rustc cannot target the 10.9 default used by CPython 3.10 Intel wheels.
# Keep this explicit so delocate and rustc agree on the wheel deployment tag.
MACOSX_DEPLOYMENT_TARGET = "10.12"
