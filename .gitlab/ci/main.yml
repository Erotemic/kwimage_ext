    python -m pip install virtualenv
    python -m virtualenv venv$PYVER
    source venv$PYVER/bin/activate
    python -m pip install pip uv -U
    python -m uv pip install setuptools -U
    python -m uv pip install pygments
    python --version  # Print out python version for debugging
  script:
  - export INSTALL_EXTRAS="tests"
  - export USE_UV_LOCK="false"
  - export LOCK_REQUIREMENTS=""
  - echo "Finding the path to the wheel"
  - ls wheelhouse || echo "wheelhouse does not exist"
  - 'echo "Installing helpers: update pip"'
